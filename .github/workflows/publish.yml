name: Build and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

env:
  DEBUG: 'napi:*'
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build
            pkg: node20-win-x64
            exe: wireshade-win-x64.exe
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
            build: npm run build -- --target x86_64-unknown-linux-gnu --cross-compile
            pkg: node20-linux-x64
            exe: wireshade-linux-x64
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
            build: npm run build -- --target aarch64-unknown-linux-gnu --cross-compile
            pkg: node20-linux-arm64
            exe: wireshade-linux-arm64
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            zig: true
            build: npm run build -- --target armv7-unknown-linux-gnueabihf --cross-compile
            pkg: node20-linux-armv7
            exe: wireshade-linux-armv7
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
            pkg: node20-macos-x64
            exe: wireshade-macos-x64
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
            pkg: node20-macos-arm64
            exe: wireshade-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Install Zig
        if: ${{ matrix.settings.zig }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: ${{ matrix.settings.build }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: wireshade.*.node
          if-no-files-found: error

      - name: Build standalone CLI executable
        if: ${{ matrix.settings.pkg }}
        run: npx pkg bin/wireshade.js --targets ${{ matrix.settings.pkg }} --output dist/${{ matrix.settings.exe }} --public

      - name: Upload CLI executable
        if: ${{ matrix.settings.pkg }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.settings.target }}
          path: dist/${{ matrix.settings.exe }}
          if-no-files-found: error

  release:
    name: Release CLI executables
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download CLI executables
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - name: List executables
        run: ls -lR cli

      - name: Publish GitHub Release with executables
        uses: softprops/action-gh-release@v2
        with:
          files: cli/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts
        run: |
          mv artifacts/bindings-*/wireshade.*.node .
          ls -R wireshade.*.node

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish
          echo "Successfully published to npm"
